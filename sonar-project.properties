# Verifica estos dos valores en SonarQube Cloud: Information del proyecto.
sonar.projectKey=Juanm42305_Luxcell
sonar.organization=juanm42305

sonar.sources=.
sonar.exclusions=node_modules/**,.next/**,out/**,build/**,coverage/**,public/**,media-originales/**
sonar.sourceEncoding=UTF-8

# Cobertura de las pruebas unitarias (npm run test:coverage genera coverage/lcov.info).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# La cobertura unitaria mide la lógica pura (lib/, schemas/). Las páginas, componentes de React,
# acciones y servicios que dependen de Supabase se prueban de punta a punta en tests/e2e y en
# supabase/tests; las pruebas, scripts y configuración no son código de la aplicación.
sonar.coverage.exclusions=app/**,components/**,features/**/components/**,features/**/actions/**,features/admin/invalidate.ts,features/admin/use-form-action.ts,features/auth/**,features/legal/**,features/inquiries/**,services/**,lib/supabase/**,types/**,config/**,proxy.ts,next.config.ts,*.config.*,scripts/**,tests/**,supabase/**
