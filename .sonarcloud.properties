# Análisis automático de SonarQube Cloud.
# El código de la aplicación es fuente; tests/ son pruebas locales (nunca se despliegan) y se
# analizan como pruebas. public/ solo contiene archivos estáticos ya optimizados.
sonar.sources=.
sonar.exclusions=tests/**,public/**,types/database.ts
sonar.tests=tests
sonar.test.inclusions=tests/**
